# Databricks Asset Bundle for the Stark Overflow fraud detection project.
# The workspace host comes from your local Databricks CLI profile (never committed).
# Deploy only after agreeing with the team: deploying can recreate pipelines and jobs.

bundle:
  name: stark_overflow

include:
  - resources/jobs/*.yml
  - resources/pipelines/*.yml

variables:
  catalog:
    description: Unity Catalog catalog that holds the curated layers.
    default: applebees_semantic
  source_root:
    description: Volume path with the raw JSONL extracts.
  warehouse_id:
    description: SQL warehouse used by SQL tasks, dashboards and Genie.
    default: ""
  source_catalog:
    description: Catalog for the isolated Silver pipeline outputs.
    default: workspace
  silver_schema:
    description: Dedicated Silver schema, not an existing shared schema.
    default: stark_silver_${workspace.current_user.short_name}
  gold_schema:
    description: Prefix for isolated per-run Gold schemas.
    default: stark_gold
  model_schema:
    description: Dedicated owned model and review output schema.
    default: stark_model_${workspace.current_user.short_name}

sync:
  include:
    - src/**
    - requirements.txt
  exclude:
    - .venv/**
    - evidence/**
    - private/**

targets:
  dev:
    mode: development
    default: true
